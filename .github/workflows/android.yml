name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pulsechat-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Read version
        id: ver
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Prepare APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk "pulsechat-v${{ steps.ver.outputs.version }}.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          TAG="v$V"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "PulseChat v$V" --notes "PulseChat v$V - Android chat app (Android 7.0+)."
          else
            gh release create "$TAG" --title "PulseChat v$V" --notes "PulseChat v$V - Android chat app (Android 7.0+)."
          fi
          gh release upload "$TAG" "pulsechat-v$V.apk" --clobber
      - name: Publish standard app.apk release
        env:
          GH_TOKEN: ${ secrets.GITHUB_TOKEN }
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          cp "$APK" app.apk
          gh release create latest app.apk --title "Latest APK" --notes "Auto-built APK from source. Direct download." --latest 2>/dev/null || gh release upload latest app.apk --clobber
